# ============================================================
# camera_config.yaml — City ANPR Camera Registry
# Each block defines one physical ANPR/CCTV camera node.
# Edit rtsp_url, user, and password for each real camera.
# Run:  py -3.13 backend/ingest_service.py
# ============================================================

# Global ingest settings
ingest:
  sample_interval_seconds: 2       # Grab a frame every N seconds per camera
  ocr_engine: easyocr              # 'easyocr' or 'tesseract'
  min_plate_confidence: 0.55       # Drop readings below this score
  save_snapshots: true             # Save cropped plate images to data/snapshots/
  max_workers: 8                   # Max parallel camera threads

cameras:
  # ── Zone 1 — Anna Salai Corridor ─────────────────────────
  - camera_id: CAM_01
    name: "Anna Salai / Gemini Flyover"
    rtsp_url: "rtsp://admin:PASSWORD@192.168.1.101:554/stream1"
    lat: 13.0522
    lon: 80.2467
    zone_id: Z1
    enabled: false     # Set to true once camera IP is configured

  - camera_id: CAM_02
    name: "Thousand Lights / Museum Rd"
    rtsp_url: "rtsp://admin:PASSWORD@192.168.1.102:554/stream1"
    lat: 13.0577
